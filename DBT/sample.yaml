version: 2

sources:
  - name: raw_data
    description: Raw e-commerce data from operational systems
    tables:
      - name: customers
        description: Customer master data
        columns:
          - name: customer_id
            description: Unique customer identifier
            tests:
              - unique
              - not_null
          - name: email
            tests:
              - unique
              - not_null
          - name: first_name
            tests:
              - not_null
          - name: created_at
            tests:
              - not_null

      - name: orders
        description: Order transaction data
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
          - name: customer_id
            tests:
              - not_null
              - relationships:
                  to: source('raw_data', 'customers')
                  field: customer_id
          - name: order_date
            tests:
              - not_null
          - name: status
            tests:
              - accepted_values:
                  values: ['pending', 'shipped', 'completed', 'returned']

      - name: order_items
        description: Individual items within orders
        columns:
          - name: order_id
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null
          - name: quantity
            tests:
              - not_null
          - name: price
            tests:
              - not_null

models:
  - name: dim_customers
    description: Customer dimension table with enriched attributes
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - unique
          - not_null
      - name: customer_lifetime_orders
        tests:
          - not_null

  - name: fct_orders
    description: Orders fact table with calculated metrics
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: order_total
        tests:
          - not_null